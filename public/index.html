<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL Analytics – Teams</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">NHL Analytics</div>
    <nav class="tabs" aria-label="Pages">
      <a class="tab active" href="/" aria-current="page">Teams</a>
      <a class="tab" href="/players.html">Players</a>
    </nav>
    <div class="spacer"></div>
    <label class="field">Season <select id="season" aria-label="Season"></select></label>
    <button class="btn" id="theme" type="button"></button>
  </div>
</header>

<main class="wrap">
  <div class="filters">
    <label class="field">Show <select id="scope"></select></label>
    <label class="field">Order charts by
      <select id="order">
        <option value="points">Points</option>
        <option value="wins">Wins</option>
        <option value="pointPct">Point %</option>
        <option value="goalDiff">Goal differential</option>
        <option value="gf">Goals for</option>
      </select>
    </label>
  </div>

  <div id="error" class="banner" hidden>
    <span id="errorText"></span>
    <button class="btn" id="retry" type="button">Retry</button>
  </div>
  <p id="loading" class="loading">Loading standings…</p>

  <section id="tiles" class="tiles" aria-label="League leaders"></section>

  <section class="charts">
    <div class="panel">
      <h2>Wins, losses and overtime losses</h2>
      <p class="sub">Games played, split by result. Hover a row for details.</p>
      <div id="chartRecord"></div>
    </div>
    <div class="panel">
      <h2>Goal differential</h2>
      <p class="sub">Goals for minus goals against.</p>
      <div id="chartDiff"></div>
    </div>
  </section>

  <section class="panel">
    <h2>Standings</h2>
    <p class="sub">Click a column to sort.</p>
    <div class="tablewrap"><table id="table"></table></div>
  </section>
</main>

<script type="module" src="/js/teams.js"></script>
</body>
</html>
