<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL Analytics</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  code { background: #8882; padding: .1em .35em; border-radius: 4px; }
  li { margin: .3rem 0; }
</style>
</head>
<body>
<h1>NHL Analytics</h1>
<p>Step 1: the data server is running. Frontend pages come next.</p>
<ul id="checks"><li>Checking endpoints…</li></ul>
<script>
const checks = [
  ['/api/health', 'Server health'],
  ['/api/standings', 'Team standings'],
  ['/api/skaters?limit=3', 'Top skaters'],
];
const ul = document.getElementById('checks');
ul.innerHTML = '';
for (const [url, label] of checks) {
  const li = document.createElement('li');
  li.textContent = `${label} (${url}): …`;
  ul.appendChild(li);
  fetch(url).then(async (r) => {
    const d = await r.json();
    li.textContent = r.ok ? `✅ ${label} (${url})` : `❌ ${label}: ${d.error}`;
  }).catch((e) => { li.textContent = `❌ ${label}: ${e.message}`; });
}
</script>
</body>
</html>
